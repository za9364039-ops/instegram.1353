<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Social App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0D0D12;
      font-family: 'Red Hat Text', sans-serif;
      overflow: hidden;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
      animation: fadeIn 0.5s ease forwards;
    }

    /* Logo mark */
    .logo-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 28px;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 48px rgba(139,92,246,0.5), 0 0 100px rgba(236,72,153,0.2);
      animation: logoPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
    }

    .logo-p {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -2px;
      line-height: 1;
    }

    /* Glow ring */
    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 32px;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      opacity: 0.25;
      filter: blur(10px);
      z-index: -1;
    }

    .app-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #A78BFA, #F472B6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp 0.5s ease 0.4s both;
    }

    .tagline {
      font-size: 14px;
      color: rgba(243,244,246,0.4);
      letter-spacing: 0.5px;
      animation: fadeUp 0.5s ease 0.55s both;
    }

    /* Progress bar */
    .progress-bar-wrap {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8B5CF6, #EC4899);
      animation: loadBar 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    }

    /* Exit fade */
    body.exit {
      animation: fadeOut 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.04); }
    }

    @keyframes logoPop {
      from { opacity: 0; transform: scale(0.6) rotate(-8deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes loadBar {
      from { width: 0%; }
      to   { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="splash">
    <div class="logo-wrap">
      <span class="logo-p">P</span>
    </div>
    <div class="app-name">Pulse</div>
    <div class="tagline">Share your world</div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar"></div>
  </div>

  <script>
    // Auto-redirect to feed after splash (1.9s)
    setTimeout(function () {
      document.body.classList.add('exit');
      setTimeout(function () {
        window.location.href = 'feed.html';
      }, 320);
    }, 1900);
  </script>

</body>
</html>
