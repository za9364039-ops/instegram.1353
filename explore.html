  <!-- Page Transition Script -->
  <script>
    (function() {
      // Fade in on load
      document.body.style.opacity = '0';
      document.body.style.transform = 'translateY(10px)';
      document.body.style.transition = 'opacity 0.28s ease, transform 0.28s ease';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.body.style.opacity = '1';
          document.body.style.transform = 'translateY(0)';
        });
      });

      // Intercept nav + back links
      document.addEventListener('click', function(e) {
        var link = e.target.closest('a[href]');
        if (!link) return;
        var href = link.getAttribute('href');
        if (!href || href === '#' || href.startsWith('http') || href.startsWith('mailto')) return;
        e.preventDefault();
        // tap scale
        link.style.transform = 'scale(0.88)';
        setTimeout(function() { link.style.transform = ''; }, 150);
        // fade out
        document.body.style.opacity = '0';
        document.body.style.transform = 'translateY(-8px)';
        document.body.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
        setTimeout(function() { window.location.href = href; }, 200);
      });
    })();
  </script>
